<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ganna ❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  min-height:100vh;
  overflow:hidden;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,77,157,.20),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(139,92,246,.20),transparent 30%),
    linear-gradient(135deg,#090014,#17001f,#080010);
}
.page{
  position:fixed;inset:0;display:none;
  justify-content:center;align-items:center;
  padding:20px;opacity:0;transition:opacity .7s ease;
}
.page.active{display:flex;opacity:1}

.login-page{flex-direction:column;text-align:center}
.login-box{
  width:min(430px,92vw);padding:35px 25px;border-radius:30px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(18px);
  box-shadow:0 0 50px rgba(255,0,130,.18);
  animation:boxFloat 3s ease-in-out infinite;
}
.login-box h1,.page-title{
  text-shadow:0 0 15px #ff4d9d,0 0 35px #ff4d9d;
  animation:pulse 2.2s infinite;
}
.login-box h1{font-size:clamp(30px,8vw,42px);margin-bottom:12px}
.login-box p{color:#ddd;line-height:1.8;margin-bottom:25px;font-size:16px}
.password{
  width:100%;padding:15px;border-radius:16px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);color:#fff;outline:none;
  text-align:center;font-size:18px;margin-bottom:15px;
}
.password::placeholder{color:#aaa}
.btn{
  border:none;cursor:pointer;color:#fff;font-size:17px;font-weight:bold;
  padding:13px 28px;border-radius:30px;
  background:linear-gradient(135deg,#ff277f,#9b5cff);
  box-shadow:0 8px 25px rgba(255,39,127,.3);
  transition:.3s ease;
}
.btn:hover{transform:scale(1.07);box-shadow:0 10px 35px rgba(255,39,127,.5)}
.error{display:none;margin-top:14px;color:#ff6b9d}

.content-page{
  flex-direction:column;gap:18px;text-align:center;
}
.page-title{font-size:clamp(25px,6vw,42px)}
.media-card{
  width:min(900px,94vw);
  border-radius:28px;padding:4px;overflow:hidden;
  background:linear-gradient(120deg,#ff277f,#9b5cff,#00d4ff,#ff277f);
  background-size:300% 300%;
  animation:gradientMove 5s ease infinite;
  box-shadow:0 0 35px rgba(255,39,127,.25);
}
.media-card img,.media-card video{
  display:block;width:100%;max-height:62vh;object-fit:contain;
  background:#000;border-radius:24px;
}
.page2-media{
  display:flex;flex-direction:column;gap:10px;
}
.page2-media img{order:1}
.page2-media video{order:2;cursor:pointer}
.page2-media img{max-height:42vh}
.page2-media video{max-height:34vh}

.nav-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

#page4{
  flex-direction:column;justify-content:flex-start;align-items:center;
  gap:16px;padding:18px 15px 25px;overflow-y:auto;
}
.message-box{
  width:min(900px,94vw);max-height:55vh;overflow-y:auto;
  padding:22px 28px;border-radius:25px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.17);
  backdrop-filter:blur(16px);
  box-shadow:0 0 30px rgba(255,39,127,.14),inset 0 0 25px rgba(255,255,255,.03);
  animation:messageBoxIn .8s ease;
}
.message-title{
  text-align:center;font-size:clamp(24px,5vw,36px);margin-bottom:12px;
  color:#fff;text-shadow:0 0 10px #ff4d9d,0 0 25px #ff4d9d;
  animation:titlePulse 2s infinite;
}
.message{
  font-size:clamp(15px,2vw,21px);line-height:2;font-weight:500;
  color:#fff;text-align:right;text-shadow:0 2px 5px #000,0 0 10px rgba(255,100,180,.35);
  white-space:pre-line;
}
.message strong{font-weight:800;color:#fff;text-shadow:0 0 8px rgba(255,77,157,.8),0 2px 5px #000}
.message-box::-webkit-scrollbar{width:5px}
.message-box::-webkit-scrollbar-thumb{background:#ff4d9d;border-radius:20px}

.video-banner{
  position:relative;width:min(900px,94vw);border-radius:28px;padding:4px;
  overflow:hidden;background:linear-gradient(120deg,#ff277f,#9b5cff,#00d4ff,#ff277f);
  background-size:300% 300%;animation:gradientMove 5s ease infinite;
  box-shadow:0 0 35px rgba(255,39,127,.3),0 0 70px rgba(155,92,255,.15);
}
.video-banner video{
  display:block;width:100%;max-height:42vh;object-fit:contain;
  background:#000;border-radius:24px;
}
.video-shine{
  position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  transform:skewX(-20deg);animation:shine 4s infinite;pointer-events:none;
}
.sound-btn{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  padding:13px 25px;border:none;border-radius:30px;color:#fff;font-size:16px;
  font-weight:bold;cursor:pointer;background:rgba(255,39,127,.92);
  backdrop-filter:blur(10px);box-shadow:0 5px 25px rgba(0,0,0,.45);
  transition:.3s;z-index:5;
}
.sound-btn:hover{transform:translateX(-50%) scale(1.08)}

.heart,.star{position:fixed;pointer-events:none;z-index:100}
.heart{color:#ff4d9d;text-shadow:0 0 15px #ff4d9d;animation:floatUp linear forwards}
.star{color:#fff;text-shadow:0 0 10px #fff;animation:floatUp linear forwards}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes titlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes boxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes messageBoxIn{
  from{opacity:0;transform:translateY(-25px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes shine{0%{left:-100%}45%,100%{left:150%}}
@keyframes floatUp{
  0%{transform:translateY(20px) scale(.5) rotate(0deg);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-110vh) scale(1.4) rotate(360deg);opacity:0}
}

@media(max-width:600px){
  #page4{padding:12px 10px 20px;gap:12px}
  .message-box{max-height:58vh;padding:18px 17px}
  .message{font-size:15px;line-height:1.9}
  .video-banner video{max-height:30vh}
  .sound-btn{padding:11px 20px;font-size:14px}
  .page2-media img{max-height:35vh}
  .page2-media video{max-height:27vh}
}

.fun-caption{
  font-size:clamp(22px,5vw,34px);
  font-weight:800;
  margin-bottom:-4px;
  color:#fff;
  text-shadow:0 0 10px #ff4d9d,0 0 25px #ff4d9d;
  animation:funBounce 1.8s ease-in-out infinite;
}
@keyframes funBounce{
  0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}
  50%{transform:translateY(-6px) rotate(1deg) scale(1.04)}
}

</style>
</head>

<body>

<section id="loginPage" class="page login-page active">
  <div class="login-box">
    <h1>يا جني ❤️</h1>
    <p>عندي حاجة صغيرة ليكي 👀<br>بس الأول الباسورد 😂</p>
    <input id="password" class="password" type="password" placeholder="اكتبي الباسورد هنا..." autocomplete="off">
    <button class="btn" onclick="checkPassword()">ادخلي ❤️</button>
    <div id="error" class="error">لأ لأ 😂 الباسورد غلط</div>
  </div>
</section>

<section id="page1" class="page content-page">
  <h1 class="page-title">يا جني ❤️</h1>
  <div class="media-card">
    <img src="https://i.ibb.co/kV2LTRsY/Whats-App-Image-2026-09-16-at-7-11-40-PM.jpg" alt="جني">
  </div>
  <button class="btn" onclick="showPage(2)">الصفحة اللي بعدها 👀❤️</button>
</section>

<section id="page2" class="page content-page">
  <h1 class="page-title">جني ❤️</h1>
  <div class="media-card page2-media">
    <img src="https://i.ibb.co/zhHT7P0M/Whats-App-Image-2026-09-16-at-7-11-41-PM-1.jpg" alt="جني">
    <video id="video2" src="https://files.catbox.moe/q29div.mp4"
           autoplay playsinline preload="auto"></video>
  </div>
  <button class="btn" onclick="showPage(3)">كملي 👀❤️</button>
</section>

<section id="page3" class="page content-page">
  <div class="fun-caption">ونبي في حلاوة كدا 😂❤️✨</div>
  <h1 class="page-title">لسه في واحدة كمان 😂❤️</h1>
  <div class="media-card">
    <img src="https://i.ibb.co/Y468Hd2S/Whats-App-Image-2026-09-16-at-7-11-41-PM.jpg" alt="جني">
  </div>
  <button class="btn" onclick="showPage(4)">آخر صفحة ❤️</button>
</section>

<section id="page4" class="page">
  <div class="message-box">
    <h2 class="message-title">رسالة لجني ❤️</h2>
    <div id="message" class="message"></div>
  </div>

  <div class="video-banner">
    <video id="video4" src="https://files.catbox.moe/pe92df.mp4"
           playsinline preload="auto"></video>
    <div class="video-shine"></div>
    <button id="soundBtn" class="sound-btn" onclick="startVideo()">🔊 شغلي الصوت</button>
  </div>
</section>

<script>
const PASSWORD = "2812";

const messageText = `جني، مش عارف هقولك كدا ازاي وامتا وفين، بس اللي ملوش قلب ملوش رزق، وبعون الله أشهد أن لا إله إلا الله.

بصي يبنت الناس، أنا أدركت إنك أحسن حد دخل حياتي، وخايف أخسرك.

وبقيتي أكتر حد فاهمني وأقرب حد ليا، أكتر من نفسي حتى، وبقيت عايز أشوفك على طول.

وعشان كدا عايز أقولك إني بحبككككك أووووي، وعايز أكمل معاكي حياتي، وشايفك أم لعيالي.

بس كنت خايف أقولك عشان علاقتنا متبوظش.`;

function checkPassword(){
  const input=document.getElementById("password");
  const error=document.getElementById("error");

  if(input.value.trim()===PASSWORD){
    error.style.display="none";
    showPage(1);
  }else{
    error.style.display="block";
    input.value="";
    input.focus();
  }
}

document.getElementById("password").addEventListener("keydown",e=>{
  if(e.key==="Enter") checkPassword();
});

function stopVideo(id){
  const video=document.getElementById(id);
  if(video){
    video.pause();
    video.currentTime=0;
  }
}

function showPage(number){
  document.querySelectorAll(".page").forEach(page=>page.classList.remove("active"));

  // إيقاف فيديو الصفحة الثانية فور مغادرتها
  if(number!==2) stopVideo("video2");

  // إيقاف فيديو الصفحة الرابعة عند مغادرتها
  if(number!==4) stopVideo("video4");

  const page=document.getElementById("page"+number);
  if(page) page.classList.add("active");

  if(number===1){
    // الصفحة الأولى صورة فقط
  }

  if(number===2){
    const video=document.getElementById("video2");
    video.currentTime=0;
    video.muted=false;
    video.volume=1;
    // تشغيل الفيديو بالصوت فور فتح الصفحة الثانية
    video.play().catch(()=>{});
  }

  if(number===3){
    // الصفحة الثالثة صورة فقط
  }

  if(number===4){
    const video=document.getElementById("video4");
    video.pause();
    video.currentTime=0;
    video.muted=true;

    const btn=document.getElementById("soundBtn");
    btn.style.display="block";
    btn.style.opacity="1";
    btn.style.pointerEvents="auto";

    startTyping();
  }
}

let typingTimer=null;

function startTyping(){
  const message=document.getElementById("message");
  message.innerHTML="";

  if(typingTimer) clearTimeout(typingTimer);

  let index=0;
  const speed=32;

  function type(){
    if(index<messageText.length){
      message.textContent += messageText.charAt(index++);
      message.parentElement.scrollTop=message.parentElement.scrollHeight;
      typingTimer=setTimeout(type,speed);
    }
  }
  type();
}

function startVideo(){
  const video=document.getElementById("video4");
  const button=document.getElementById("soundBtn");

  video.muted=false;

  video.play().then(()=>{
    button.textContent="🔊 الصوت شغال ❤️";
    setTimeout(()=>{
      button.style.opacity="0";
      button.style.pointerEvents="none";
    },1500);
  }).catch(()=>{
    button.textContent="اضغطي مرة كمان 🔊";
  });
}

// الصفحة الثانية: أول دوسة على الشاشة تشغّل الفيديو بالصوت
document.addEventListener("pointerdown", function(e){
  const page2 = document.getElementById("page2");
  const video = document.getElementById("video2");
  if(!page2 || !video || !page2.classList.contains("active")) return;

  // لو الدوسة على زر الانتقال، سيب الزر يشتغل عادي.
  if(e.target.closest(".btn")) return;

  video.muted = false;
  video.volume = 1;
  video.play().catch(()=>{});
}, {passive:true});

// كمان الدوس مباشرة على الفيديو يشغله بالصوت.
document.getElementById("video2").addEventListener("click", function(){
  this.muted = false;
  this.volume = 1;
  this.play().catch(()=>{});
});

function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  const hearts=["❤️","💗","💖","💕","💓","💞"];
  heart.textContent=hearts[Math.floor(Math.random()*hearts.length)];
  heart.style.left=Math.random()*100+"vw";
  heart.style.bottom="-30px";
  heart.style.animationDuration=(4+Math.random()*5)+"s";
  heart.style.fontSize=(15+Math.random()*18)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),9000);
}

function createStar(){
  const star=document.createElement("div");
  star.className="star";
  star.textContent="✦";
  star.style.left=Math.random()*100+"vw";
  star.style.bottom="-20px";
  star.style.animationDuration=(5+Math.random()*6)+"s";
  star.style.fontSize=(8+Math.random()*12)+"px";
  document.body.appendChild(star);
  setTimeout(()=>star.remove(),11000);
}

setInterval(createHeart,650);
setInterval(createStar,450);
</script>

</body>
</html>
